name: Extract Kesape embeds
on:
  workflow_dispatch:
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public landing and extract video URLs
        run: |
          python - <<'PY'
          import urllib.request,re
          url='https://escuelakesape.com/tremp-bike-camp/'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          html=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','ignore')
          pats=[
            r'https?://(?:www\.)?youtube(?:-nocookie)?\.com/embed/[A-Za-z0-9_-]+[^"\']*',
            r'https?://(?:www\.)?youtube\.com/watch\?v=[A-Za-z0-9_-]+[^"\']*',
            r'https?://youtu\.be/[A-Za-z0-9_-]+[^"\']*'
          ]
          urls=[]
          for p in pats:
            urls += re.findall(p,html)
          urls=sorted(set(u.replace('&amp;','&') for u in urls))
          open('kesape-embeds.txt','w').write('\n'.join(urls))
          print('\n'.join(urls))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kesape-embeds
          path: kesape-embeds.txt
