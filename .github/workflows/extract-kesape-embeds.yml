name: Extract Kesape embeds
on:
  push:
    branches: ["main"]
  workflow_dispatch:
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public landing and inspect video markup
        run: |
          python - <<'PY'
          import urllib.request,re,html as h
          url='https://escuelakesape.com/tremp-bike-camp/'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          s=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','ignore')
          s=h.unescape(s)
          found=set()
          patterns=[
            r'(?:youtube(?:-nocookie)?\.com/(?:embed/|watch\?v=)|youtu\.be/)([A-Za-z0-9_-]{6,})',
            r'(?:videoid|video-id|data-video-id|youtube_id|youtubeId)[\"\'=:\s]+([A-Za-z0-9_-]{6,})'
          ]
          for p in patterns:
            for x in re.findall(p,s,re.I):
              found.add(x)
          print("YOUTUBE_IDS")
          for x in sorted(found): print(x)
          print("\nCONTEXT")
          for m in re.finditer(r'(?i)(youtube|youtu\.be|videoid|video-id|data-video|iframe|lite-youtube)',s):
            a=max(0,m.start()-220); b=min(len(s),m.start()+500)
            print("----")
            print(re.sub(r'\s+',' ',s[a:b]))
          PY
